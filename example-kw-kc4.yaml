# --- Viessmann Vitotronic KC2 / KC4 - KW protocol ---
#
# Reads boiler temperature / boiler set temperature and provides an
# EXPERIMENTAL writable number for the boiler set temperature.
#
# !!! WARNING !!!
# - 0x5502 is a known READ address (openv: getTempKsoll). A matching write
#   command is NOT documented. It might be an internally calculated value
#   that ignores or immediately overwrites written values.
# - Only test while supervising the heating. Verify the result on the
#   control panel. Keep a known-good firmware for fallback.
# - Do NOT connect automations to writable numbers until verified. Many
#   values are stored in EEPROM; frequent writes can wear it out.

external_components:
  - source: components
  # - source: github://<your-user>/esphome_vitoconnect

esphome:
  name: viessmann-kc4
  friendly_name: Viessmann KC4

esp8266:
  board: nodemcuv2

# UART0 (GPIO1/GPIO3) is used for the optolink -> disable serial logging
logger:
  baud_rate: 0
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Viessmann KC4 Fallback"

captive_portal:

uart:
  - id: vitotronic_uart
    rx_pin: GPIO03 # ESP8266 RX
    tx_pin: GPIO01 # ESP8266 TX
    baud_rate: 4800
    data_bits: 8
    parity: EVEN
    stop_bits: 2
    # Uncomment to log raw telegrams (e.g. write F4 55 02 02 B8 01 -> ACK 00)
    # debug:
    #   direction: BOTH
    #   dummy_receiver: false
    #   sequence:
    #     - lambda: UARTDebug::log_hex(direction, bytes, ':');

vitoconnect:
  id: kc4_conn
  uart_id: vitotronic_uart
  protocol: KW
  update_interval: 60s

sensor:
  - platform: vitoconnect
    name: "Kesseltemperatur"
    address: 0x0802
    length: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: vitoconnect
    name: "Kesselsolltemperatur"
    address: 0x5502
    length: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

number:
  # EXPERIMENTAL: write test for boiler set temperature.
  # value = raw * factor, raw = value / factor (little endian, signed for length 2)
  # 44 °C -> raw 440 -> telegram F4 55 02 02 B8 01
  # After an ACK (0x00) the value is read back immediately.
  - platform: vitoconnect
    name: "Kesselsollwert (EXPERIMENTELL)"
    address: 0x5502
    length: 2
    factor: 0.1
    min_value: 43
    max_value: 45
    step: 1
    mode: box
    unit_of_measurement: "°C"
    device_class: temperature
